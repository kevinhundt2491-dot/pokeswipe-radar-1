[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  # Netlify Server (API unter /api/*) braucht Node.js 24
  NODE_VERSION = "24"
  # Die App ist statisches HTML + API – das in Netlify installierte Next.js-Plugin überspringen
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Der API-Server beantwortet /api/*, die öffentlichen Karten- & Set-Seiten, die Rechtsseiten (inkl. Kündigungsbutton)
# die Sitemaps, Pokémon-/Sealed-/Trend-Seiten, Teilen-Kurzlinks (/s/…), Einladungsseiten, öffentliche Sammler-Profile (/u/…)
# und teilbare Pull-Wall-Beiträge (/p/…) – alles andere ist die statische App
[server]
  path = ["/api/*", "/karte/*", "/sitemap.xml", "/sitemaps/*", "/sets", "/set/*", "/rechtliches", "/impressum", "/agb", "/widerruf", "/kuendigen", "/pokemon", "/pokemon/*", "/sealed", "/sealed/*", "/trends", "/s/*", "/einladung/*", "/u/*", "/p/*", "/.well-known/apple-app-site-association", "/.well-known/assetlinks.json"]

# Kartenbilder über das Netlify Image CDN (verkleinert, WebP/AVIF)
[images]
  remote_images = ['https://assets\.tcgdex\.net/.*', 'https://images\.pokemontcg\.io/.*', 'https://raw\.githubusercontent\.com/.*']

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self), payment=(self), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Permitted-Cross-Domain-Policies = "none"
    # Content-Security-Policy: nur eigene Dateien + die wirklich genutzten Dienste (Firebase, TCGdex, OpenStreetMap, Make.com für Admin-Reels)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://*.firebasedatabase.app https://*.firebaseio.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' data: blob: https://api.tcgdex.net https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://nominatim.openstreetmap.org https://www.gstatic.com https://*.make.com; frame-src https://*.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Lokal gehostete Schriften & Leaflet (DSGVO: kein Google Fonts / unpkg mehr)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Händler-Shops: /shop/<name> öffnet die App, die den Shop anzeigt
[[redirects]]
  from = "/shop/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
